<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>printedpipes — configurator</title>
  <style>
    * { box-sizing: border-box; }
    body, html { margin: 0; padding: 0; background: #050505; color: #ccc;
                 font-family: ui-monospace, Menlo, Consolas, monospace;
                 height: 100%; overflow: hidden; }

    #app { display: flex; height: 100vh; }

    #panel {
      width: 340px; min-width: 340px;
      background: #0a0a0a; border-right: 1px solid #1f1f1f;
      padding: 18px 18px 14px;
      display: flex; flex-direction: column; gap: 12px;
      overflow-y: auto;
    }
    #panel h1 { font-size: 14px; color: #fff; margin: 0 0 4px;
                letter-spacing: 0.5px; text-transform: uppercase; }
    #panel .sub { font-size: 11px; color: #666; margin-bottom: 4px; }

    .tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-bottom: 4px; }
    .tab {
      background: #0e0e0e; color: #888; border: 1px solid #1a1a1a;
      padding: 8px 4px; font-family: inherit; font-size: 10px;
      letter-spacing: 0.5px; text-transform: uppercase; cursor: pointer;
      border-radius: 3px; transition: all 100ms;
    }
    .tab:hover { color: #ccc; border-color: #2a2a2a; }
    .tab.active { background: #1a3a6a; color: #fff; border-color: #2a5aaa; }

    .tpl-desc { font-size: 10px; color: #666; margin: -2px 0 6px; line-height: 1.4; }

    .field { display: flex; flex-direction: column; gap: 4px; }
    .field-row { display: flex; justify-content: space-between; align-items: baseline; }
    .field-label { font-size: 11px; color: #aaa; text-transform: uppercase; letter-spacing: 0.5px; }
    .field-value { font-size: 12px; color: #fff; font-variant-numeric: tabular-nums; }

    input[type="range"] {
      -webkit-appearance: none; appearance: none;
      width: 100%; height: 4px; background: #1c1c1c; border-radius: 2px;
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 14px; height: 14px; border-radius: 50%;
      background: #88aaff; cursor: pointer;
    }
    input[type="range"]::-moz-range-thumb {
      width: 14px; height: 14px; border-radius: 50%;
      background: #88aaff; cursor: pointer; border: none;
    }

    select {
      background: #141414; color: #ddd; border: 1px solid #2a2a2a;
      padding: 6px 8px; font-family: inherit; font-size: 12px;
      border-radius: 3px;
    }

    button#download {
      background: #1a3a6a; color: #fff; border: 1px solid #2a5aaa;
      padding: 10px 14px; font-family: inherit; font-size: 12px;
      letter-spacing: 0.5px; text-transform: uppercase; cursor: pointer;
      border-radius: 3px; transition: background 100ms;
    }
    button#download:hover { background: #2a5aaa; }
    button#download:disabled { background: #333; border-color: #444; color: #777; cursor: wait; }

    #hardware {
      margin-top: 4px; padding: 10px 12px;
      background: #0e1014; border: 1px solid #1a2030; border-radius: 4px;
      font-size: 11px; color: #aab; line-height: 1.5;
    }
    #hardware .hw-label {
      font-size: 9px; letter-spacing: 0.5px; text-transform: uppercase;
      color: #66c; margin-bottom: 4px;
    }
    #hardware .hw-body b { color: #fff; font-weight: normal; }
    #hardware .hw-body .qty { color: #88aaff; font-variant-numeric: tabular-nums; }

    #stats {
      margin-top: auto; padding-top: 12px; border-top: 1px solid #1a1a1a;
      font-size: 10px; color: #555; line-height: 1.6;
    }
    #stats b { color: #888; font-weight: normal; }

    #viewport { flex: 1; position: relative; }
    #overlay {
      position: absolute; bottom: 10px; right: 14px;
      font-size: 10px; color: #555; pointer-events: none;
      text-align: right; line-height: 1.4;
    }
    #status {
      position: absolute; top: 10px; right: 14px;
      font-size: 11px; color: #ffb84a;
      pointer-events: none;
    }
    #status.ok { color: #4a8; }
    #status.busy { color: #ffb84a; }
  </style>
</head>
<body>
  <div id="app">
    <div id="panel">
      <h1>printedpipes</h1>
      <div class="sub">DWV fitting configurator · v0</div>

      <div class="tabs" id="tabs">
        <button class="tab active" data-tpl="ptrap">P-trap</button>
        <button class="tab" data-tpl="straight">Straight</button>
        <button class="tab" data-tpl="elbow">Elbow</button>
        <button class="tab" data-tpl="tee">T-pipe</button>
      </div>

      <div class="tpl-desc" id="tpl-desc"></div>

      <div id="params"></div>

      <button id="download">Download STL</button>

      <div id="hardware">
        <div class="hw-label">Hardware needed</div>
        <div id="hw-body" class="hw-body">—</div>
      </div>

      <div id="stats">
        <div><b>Triangles:</b> <span id="stat-tri">—</span></div>
        <div><b>Pipe volume:</b> <span id="stat-vol">—</span> cm³</div>
        <div><b>Surface area:</b> <span id="stat-sa">—</span> cm²</div>
        <div><b>Extents (X·Y·Z):</b> <span id="stat-ext">—</span> mm</div>
        <div><b>Genus:</b> <span id="stat-genus">—</span></div>
        <div><b>Build time:</b> <span id="stat-time">—</span> ms</div>
      </div>
    </div>

    <div id="viewport">
      <div id="status" class="busy">loading Manifold WASM…</div>
      <div id="overlay">drag = rotate · scroll = zoom · right-drag = pan</div>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ─── Manifold WASM init ───────────────────────────────────────────────
    const Module = (await import('./manifold.js')).default;
    const wasm = await Module({ locateFile: () => './manifold.wasm' });
    wasm.setup();
    const { Manifold, CrossSection } = wasm;

    // ─── Pipe specs (Schedule 40 PVC DWV) ─────────────────────────────────
    // Fittings are sized to slip into standard Fernco rubber couplings — OD
    // matches Schedule 40 PVC pipe so a 1056-series Fernco grips both our
    // printed stub and the customer's existing pipe.
    //
    // Wall thickness comes from spec, not from a user knob: at standard
    // dimensions ASA prints plenty strong for non-pressurized DWV.
    const PIPE_SPECS = {
      '125': { nominal: '1¼"', od: 42.16, id: 35.05, fernco: '1056-125' },
      '150': { nominal: '1½"', od: 48.26, id: 40.89, fernco: '1056-150' },
      '200': { nominal: '2"',  od: 60.33, id: 52.50, fernco: '1056-22'  },
      '300': { nominal: '3"',  od: 88.90, id: 77.93, fernco: '1056-33'  },
    };
    function specFor(key) { return PIPE_SPECS[String(key)]; }
    const PIPE_SIZE_FIELD = {
      id: 'pipeSize',
      label: 'Pipe size',
      type: 'select',
      options: Object.entries(PIPE_SPECS).map(([k, s]) =>
        ({ value: k, label: `${s.nominal} Sch 40 (OD ${s.od.toFixed(1)} · ID ${s.id.toFixed(1)})` })
      ),
      default: '150',
    };

    // ─── Template registry ────────────────────────────────────────────────
    const TEMPLATES = {

      ptrap: {
        label: 'P-trap',
        description: 'Sink drain — integrated 180° U-bend + 90° elbow + trap arm. Trap arm extends opposite the tailpiece. Tailpiece and arm are sized for Fernco coupling on each end.',
        params: [
          PIPE_SIZE_FIELD,
          { id: 'bendR',   label: 'Bend radius',     type: 'range', min: 25, max: 80,  step: 1, default: 50,  unit: 'mm' },
          { id: 'tailLen', label: 'Tail length',     type: 'range', min: 40, max: 200, step: 2, default: 60,  unit: 'mm' },
          { id: 'armLen',  label: 'Trap arm length', type: 'range', min: 60, max: 400, step: 5, default: 150, unit: 'mm' },
        ],
        generate(params, { seg }) {
          const { pipeSize, bendR, tailLen, armLen } = params;
          const spec = specFor(pipeSize);
          const rOuter = spec.od / 2;
          const rInner = spec.id / 2;
          const buildPath = (radius) => {
            const ubendDisk = CrossSection.circle(radius, seg).translate([bendR, 0]);
            const ubend = Manifold.revolve(ubendDisk, seg, 180).rotate([-90, 0, 0]);
            const tail = Manifold.cylinder(tailLen, radius, radius, seg, false)
              .translate([bendR, 0, 0]);
            const elbowDisk = CrossSection.circle(radius, seg).translate([bendR, 0]);
            const elbow = Manifold.revolve(elbowDisk, seg, 90)
              .rotate([90, 0, 0])
              .translate([-2 * bendR, 0, 0]);
            const arm = Manifold.cylinder(armLen, radius, radius, seg, false)
              .rotate([0, -90, 0])
              .translate([-2 * bendR, 0, bendR]);
            const u = Manifold.union([ubend, tail, elbow, arm]);
            ubend.delete(); tail.delete(); elbow.delete(); arm.delete();
            return u;
          };
          const outer = buildPath(rOuter);
          const inner = buildPath(rInner);
          const pipe = outer.subtract(inner);
          outer.delete(); inner.delete();
          return pipe;
        },
      },

      straight: {
        label: 'Straight',
        description: 'Plain pipe section, cut to length. Both ends slip into Fernco couplings — useful as a length-adjustment piece between two fixed fittings.',
        params: [
          PIPE_SIZE_FIELD,
          { id: 'length', label: 'Length', type: 'range', min: 60, max: 600, step: 5, default: 120, unit: 'mm' },
        ],
        generate(params, { seg }) {
          const { pipeSize, length } = params;
          const spec = specFor(pipeSize);
          const rOuter = spec.od / 2;
          const rInner = spec.id / 2;
          const outer = Manifold.cylinder(length, rOuter, rOuter, seg, false);
          const inner = Manifold.cylinder(length, rInner, rInner, seg, false);
          const pipe = outer.subtract(inner);
          outer.delete(); inner.delete();
          return pipe;
        },
      },

      elbow: {
        label: 'Elbow',
        description: 'Custom-angle bend with a Fernco-compatible stub on each end. 5° to 180° — for angles catalog elbows don\'t cover. Stubs sized to grip standard Fernco couplings (≥30 mm).',
        params: [
          PIPE_SIZE_FIELD,
          { id: 'angle',   label: 'Bend angle',   type: 'range', min: 5,  max: 180, step: 1, default: 90, unit: '°' },
          { id: 'bendR',   label: 'Bend radius',  type: 'range', min: 15, max: 150, step: 1, default: 40, unit: 'mm' },
          { id: 'stubLen', label: 'Stub length',  type: 'range', min: 30, max: 100, step: 1, default: 40, unit: 'mm' },
        ],
        generate(params, { seg }) {
          const { pipeSize, angle, bendR, stubLen } = params;
          const spec = specFor(pipeSize);
          const rOuter = spec.od / 2;
          const rInner = spec.id / 2;
          const buildPath = (radius) => {
            // Bend: revolve a disk around the Z axis from θ=0 to θ=angle.
            // Centerline arc lies in the XY plane.
            //   Cap1 at (bendR, 0, 0)               outward normal -Y
            //   Cap2 at (bendR·cosα, bendR·sinα, 0) outward normal (-sinα, cosα, 0)
            const bendDisk = CrossSection.circle(radius, seg).translate([bendR, 0]);
            const bend = Manifold.revolve(bendDisk, seg, angle);

            // Stub1 on cap1: a +Z cylinder rotated to align with -Y, then placed.
            //   rotate([90, 0, 0]) maps +Z → -Y.
            const stub1 = Manifold.cylinder(stubLen, radius, radius, seg, false)
              .rotate([90, 0, 0])
              .translate([bendR, 0, 0]);

            // Stub2 on cap2: a +Z cylinder aligned with (-sinα, cosα, 0).
            //   rotate([-90, 0, 0]) maps +Z → +Y.
            //   then rotate([0, 0, angle]) rotates +Y → (-sinα, cosα, 0).
            const cosA = Math.cos(angle * Math.PI / 180);
            const sinA = Math.sin(angle * Math.PI / 180);
            const stub2 = Manifold.cylinder(stubLen, radius, radius, seg, false)
              .rotate([-90, 0, 0])
              .rotate([0, 0, angle])
              .translate([bendR * cosA, bendR * sinA, 0]);

            const u = Manifold.union([bend, stub1, stub2]);
            bend.delete(); stub1.delete(); stub2.delete();
            return u;
          };
          const outer = buildPath(rOuter);
          const inner = buildPath(rInner);
          const pipe = outer.subtract(inner);
          outer.delete(); inner.delete();
          return pipe;
        },
      },

      tee: {
        label: 'T-pipe',
        description: 'Three-way junction — main run plus branch at custom angle. 90° = standard tee; <90° = sweep (sanitary) tee. All three ends slip into Fernco couplings.',
        params: [
          PIPE_SIZE_FIELD,
          { id: 'mainLen',     label: 'Main length',   type: 'range', min: 80, max: 400, step: 5, default: 140, unit: 'mm' },
          { id: 'branchLen',   label: 'Branch length', type: 'range', min: 40, max: 250, step: 5, default: 80,  unit: 'mm' },
          { id: 'branchAngle', label: 'Branch angle',  type: 'range', min: 30, max: 90,  step: 5, default: 90,  unit: '°' },
        ],
        generate(params, { seg }) {
          const { pipeSize, mainLen, branchLen, branchAngle } = params;
          const spec = specFor(pipeSize);
          const rOuter = spec.od / 2;
          const rInner = spec.id / 2;
          const buildPath = (radius) => {
            // Main: +Z cylinder rotated +90° around Y so axis is +X. Center on origin.
            const main = Manifold.cylinder(mainLen, radius, radius, seg, false)
              .rotate([0, 90, 0])
              .translate([-mainLen / 2, 0, 0]);

            // Branch: angle measured from main axis (+X). Direction in XZ plane:
            //   (cos β, 0, sin β).
            //   β=90° → branch perpendicular (+Z).
            //   β=45° → sweep, leaning forward.
            // A +Z cylinder rotated [0, 90-β, 0] around Y points exactly that way.
            const branch = Manifold.cylinder(branchLen, radius, radius, seg, false)
              .rotate([0, 90 - branchAngle, 0]);

            const u = Manifold.union([main, branch]);
            main.delete(); branch.delete();
            return u;
          };
          const outer = buildPath(rOuter);
          const inner = buildPath(rInner);
          const pipe = outer.subtract(inner);
          outer.delete(); inner.delete();
          return pipe;
        },
      },

    };

    // ─── three.js scene ───────────────────────────────────────────────────
    const viewport = document.getElementById('viewport');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050505);

    const camera = new THREE.PerspectiveCamera(45, viewport.clientWidth / viewport.clientHeight, 1, 5000);
    camera.position.set(280, 200, 320);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(viewport.clientWidth, viewport.clientHeight);
    viewport.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    scene.add(new THREE.AmbientLight(0x404040, 1.6));
    const key = new THREE.DirectionalLight(0xffffff, 1.3);
    key.position.set(200, 350, 220);
    scene.add(key);
    const fill = new THREE.DirectionalLight(0xa0b8ff, 0.45);
    fill.position.set(-220, -120, -180);
    scene.add(fill);
    const rim = new THREE.DirectionalLight(0xffe0a0, 0.25);
    rim.position.set(80, 50, -300);
    scene.add(rim);

    const grid = new THREE.GridHelper(500, 50, 0x1c1c1c, 0x101010);
    scene.add(grid);
    const axes = new THREE.AxesHelper(40);
    scene.add(axes);

    const material = new THREE.MeshStandardMaterial({
      color: 0xe6e6e6,
      roughness: 0.5,
      metalness: 0.0,
      side: THREE.DoubleSide,
    });

    let currentMesh = null;

    function applyMeshToScene(mfldMesh) {
      const geom = new THREE.BufferGeometry();
      geom.setAttribute('position', new THREE.BufferAttribute(mfldMesh.vertProperties, mfldMesh.numProp || 3));
      geom.setIndex(new THREE.BufferAttribute(mfldMesh.triVerts, 1));
      geom.computeVertexNormals();

      if (currentMesh) {
        scene.remove(currentMesh);
        currentMesh.geometry.dispose();
      }
      currentMesh = new THREE.Mesh(geom, material);
      currentMesh.rotation.x = -Math.PI / 2; // Manifold Z-up → three.js Y-up
      scene.add(currentMesh);
    }

    function frameCamera(box) {
      const center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());
      controls.target.copy(center);
      const maxDim = Math.max(size.x, size.y, size.z);
      const dist = maxDim * 1.6;
      camera.position.set(center.x + dist * 0.85, center.y + dist * 0.55, center.z + dist * 0.95);
      controls.update();
    }

    // ─── Param UI generation ──────────────────────────────────────────────
    let activeTemplateId = 'ptrap';
    const paramsContainer = document.getElementById('params');
    const tplDescEl       = document.getElementById('tpl-desc');
    const inputRefs       = {}; // current template's input elements, keyed by param.id

    function buildParamUI(templateId) {
      const tpl = TEMPLATES[templateId];
      tplDescEl.textContent = tpl.description;
      paramsContainer.innerHTML = '';
      Object.keys(inputRefs).forEach(k => delete inputRefs[k]);

      for (const p of tpl.params) {
        const field = document.createElement('div');
        field.className = 'field';

        const row = document.createElement('div');
        row.className = 'field-row';
        const lbl = document.createElement('span');
        lbl.className = 'field-label';
        lbl.textContent = p.label;
        row.appendChild(lbl);

        if (p.type === 'range') {
          const val = document.createElement('span');
          val.className = 'field-value';
          row.appendChild(val);
          field.appendChild(row);

          const input = document.createElement('input');
          input.type = 'range';
          input.min = p.min; input.max = p.max; input.step = p.step;
          input.value = p.default;
          input.addEventListener('input', () => {
            const v = (p.decimals != null) ? parseFloat(input.value).toFixed(p.decimals) : input.value;
            val.textContent = v + ' ' + p.unit;
            scheduleRebuild();
          });
          const v0 = (p.decimals != null) ? parseFloat(input.value).toFixed(p.decimals) : input.value;
          val.textContent = v0 + ' ' + p.unit;
          field.appendChild(input);
          inputRefs[p.id] = { type: 'range', el: input };

        } else if (p.type === 'select') {
          field.appendChild(row);
          const sel = document.createElement('select');
          for (const opt of p.options) {
            const o = document.createElement('option');
            o.value = opt.value; o.textContent = opt.label;
            sel.appendChild(o);
          }
          sel.value = p.default;
          sel.addEventListener('change', scheduleRebuild);
          field.appendChild(sel);
          inputRefs[p.id] = { type: 'select', el: sel };
        }

        paramsContainer.appendChild(field);
      }
    }

    function readParams() {
      const out = {};
      for (const [id, ref] of Object.entries(inputRefs)) {
        out[id] = parseFloat(ref.el.value);
      }
      return out;
    }

    // ─── Build pipeline ───────────────────────────────────────────────────
    let framedOnceForTemplate = {};
    function rebuild({ seg = 48, frame = false } = {}) {
      const t0 = performance.now();
      const params = readParams();
      const tpl = TEMPLATES[activeTemplateId];
      let pipe;
      try {
        pipe = tpl.generate(params, { seg });
      } catch (e) {
        console.error(e);
        setStatus('GEOM ERROR — see console', 'busy');
        return;
      }
      const mfldMesh = pipe.getMesh();
      const stats = {
        tri: pipe.numTri(),
        vol: pipe.volume() / 1000,
        sa:  pipe.surfaceArea() / 100,
        bbox: pipe.boundingBox(),
        genus: pipe.genus(),
      };
      pipe.delete();

      applyMeshToScene(mfldMesh);
      const elapsed = performance.now() - t0;
      updateStats(stats, elapsed);
      updateHardware();

      if (frame || !framedOnceForTemplate[activeTemplateId]) {
        const box = new THREE.Box3().setFromObject(currentMesh);
        frameCamera(box);
        framedOnceForTemplate[activeTemplateId] = true;
      }
    }

    // How many open ends each template exposes for Fernco joining.
    const FERNCO_ENDS = { ptrap: 2, straight: 2, elbow: 2, tee: 3 };

    function updateHardware() {
      const params = readParams();
      const spec = specFor(params.pipeSize);
      const ends = FERNCO_ENDS[activeTemplateId] || 2;
      const tpl = TEMPLATES[activeTemplateId];
      const hw = document.getElementById('hw-body');
      hw.innerHTML =
        `<span class="qty">${ends}×</span> <b>Fernco ${spec.fernco}</b> ` +
        `(${spec.nominal} flexible coupling)<br>` +
        `<span style="color:#667;font-size:10px">` +
        `Stub OD ${spec.od.toFixed(1)} mm matches Sch 40 PVC. ` +
        `Slip Fernco over our stub and existing pipe, tighten both clamps.` +
        `</span>`;
    }

    function updateStats(s, elapsed) {
      document.getElementById('stat-tri').textContent = s.tri.toLocaleString();
      document.getElementById('stat-vol').textContent = s.vol.toFixed(1);
      document.getElementById('stat-sa').textContent  = s.sa.toFixed(1);
      const ex = [
        s.bbox.max[0] - s.bbox.min[0],
        s.bbox.max[1] - s.bbox.min[1],
        s.bbox.max[2] - s.bbox.min[2],
      ];
      document.getElementById('stat-ext').textContent = ex.map(v => v.toFixed(0)).join(' · ');
      document.getElementById('stat-genus').textContent = s.genus;
      document.getElementById('stat-time').textContent = elapsed.toFixed(0);
    }

    function setStatus(text, cls) {
      const el = document.getElementById('status');
      el.textContent = text;
      el.className = cls;
    }

    function debounce(fn, ms) {
      let t = null;
      return (...args) => {
        clearTimeout(t);
        t = setTimeout(() => fn(...args), ms);
      };
    }
    const scheduleRebuild = debounce(() => {
      setStatus('rendering…', 'busy');
      requestAnimationFrame(() => {
        rebuild({ seg: 48 });
        setStatus('ready', 'ok');
      });
    }, 120);

    // ─── Tab switching ────────────────────────────────────────────────────
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        const id = tab.dataset.tpl;
        if (id === activeTemplateId) return;
        document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t === tab));
        activeTemplateId = id;
        buildParamUI(id);
        setStatus('rendering…', 'busy');
        requestAnimationFrame(() => {
          rebuild({ seg: 48, frame: true });
          setStatus('ready', 'ok');
        });
      });
    });

    // ─── STL writer + download ────────────────────────────────────────────
    function writeBinarySTL(mesh, headerText) {
      const { vertProperties, triVerts, numProp } = mesh;
      const stride = numProp || 3;
      const triCount = triVerts.length / 3;
      const bytes = 84 + triCount * 50;
      const buf = new ArrayBuffer(bytes);
      const dv = new DataView(buf);
      const u8 = new Uint8Array(buf);

      const ht = headerText.slice(0, 80);
      for (let i = 0; i < ht.length; i++) u8[i] = ht.charCodeAt(i);
      dv.setUint32(80, triCount, true);

      let off = 84;
      const v = vertProperties;
      for (let i = 0; i < triCount; i++) {
        const i0 = triVerts[i*3 + 0] * stride;
        const i1 = triVerts[i*3 + 1] * stride;
        const i2 = triVerts[i*3 + 2] * stride;
        const ax = v[i0], ay = v[i0+1], az = v[i0+2];
        const bx = v[i1], by = v[i1+1], bz = v[i1+2];
        const cx = v[i2], cy = v[i2+1], cz = v[i2+2];
        const ux = bx-ax, uy = by-ay, uz = bz-az;
        const wx = cx-ax, wy = cy-ay, wz = cz-az;
        let nx = uy*wz - uz*wy;
        let ny = uz*wx - ux*wz;
        let nz = ux*wy - uy*wx;
        const len = Math.hypot(nx, ny, nz) || 1;
        nx /= len; ny /= len; nz /= len;

        dv.setFloat32(off,    nx, true); dv.setFloat32(off+4,  ny, true); dv.setFloat32(off+8,  nz, true);
        dv.setFloat32(off+12, ax, true); dv.setFloat32(off+16, ay, true); dv.setFloat32(off+20, az, true);
        dv.setFloat32(off+24, bx, true); dv.setFloat32(off+28, by, true); dv.setFloat32(off+32, bz, true);
        dv.setFloat32(off+36, cx, true); dv.setFloat32(off+40, cy, true); dv.setFloat32(off+44, cz, true);
        dv.setUint16(off+48,  0,  true);
        off += 50;
      }
      return new Blob([buf], { type: 'model/stl' });
    }

    document.getElementById('download').addEventListener('click', () => {
      setStatus('generating high-quality STL…', 'busy');
      requestAnimationFrame(() => {
        const params = readParams();
        const tpl = TEMPLATES[activeTemplateId];
        const pipe = tpl.generate(params, { seg: 96 });
        const mesh = pipe.getMesh();
        pipe.delete();

        const blob = writeBinarySTL(mesh, `printedpipes ${activeTemplateId}`);
        const paramSlug = Object.entries(params)
          .map(([k, v]) => `${k}${typeof v === 'number' ? v.toFixed(0) : v}`)
          .join('_');
        const name = `${activeTemplateId}_${paramSlug}.stl`;
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = name;
        document.body.appendChild(a); a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        setStatus('ready', 'ok');
      });
    });

    // ─── Resize & loop ────────────────────────────────────────────────────
    window.addEventListener('resize', () => {
      camera.aspect = viewport.clientWidth / viewport.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(viewport.clientWidth, viewport.clientHeight);
    });

    (function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    })();

    // ─── Boot ─────────────────────────────────────────────────────────────
    setStatus('ready', 'ok');
    buildParamUI(activeTemplateId);
    rebuild({ seg: 48, frame: true });
  </script>
</body>
</html>
